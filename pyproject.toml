[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taracpu"
version = "1.3.5"
description = "C compiler, assembly simulator and FPGA tools for the TARA16 teaching processor."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ayon Chakraborty" }]
dependencies = [
    "PyQt5>=5.15",
    "matplotlib>=3.5",
    "pyserial>=3.5",
]

[project.scripts]
taracpu = "taracpu:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "taracpu*"]

[tool.setuptools.package-data]
"src" = [
    "assets/*",
    "assets/logo/*",
    "examples/progs/*.tara",
    "examples/progs/Basic/*.tara",
    "examples/progs/Intermediate/*.tara",
    "examples/progs/Advanced/*.tara",
    "examples/progs/Display/*.tara",
    "examples/progs/Games/*.tara",
    "compiler/examples/*.c",
    "compiler/examples/*/*.c",
    "compiler/tara16cc/include/*.h",
    "compiler/tara16cc/runtime/*.s",
    "compiler/*.md",
    "compiler/LICENSE*",
]
